name: Validate Power BI GitOps

on:
  pull_request:
    paths:
      - "semantic-model/**"
      - "report/**"
      - "templates/**"
      - "config/**"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, test, prod]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_repo.py --environment "${{ matrix.environment }}"
      - run: python -m compileall -q scripts
